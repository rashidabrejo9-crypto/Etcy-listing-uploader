<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Etsy Listing Uploader</title>
<style>
body{font-family:Arial,sans-serif;max-width:900px;margin:30px auto;padding:0 16px;background:#fafafa;color:#222}
.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:20px;margin:16px 0}
button{padding:10px 16px;border:0;border-radius:8px;cursor:pointer;margin-right:8px}
select{width:100%;padding:10px;margin:10px 0}
#status{white-space:pre-wrap;margin-top:12px}
table{width:100%;border-collapse:collapse}
th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left}
.success{color:green}.error{color:#b00020}
</style>
</head>
<body>
<h1>Etsy Listing Uploader</h1>

<div class="card">
<h2>Etsy Connection</h2>
<button id="connect">Connect Etsy Shop</button>
<button id="logout">Logout</button>
<div id="status">Checking connection…</div>
</div>

<div class="card" id="shopCard" hidden>
<h2>Shop</h2>
<select id="shops"></select>
<button id="loadListings">Load Listings</button>
</div>

<div class="card" id="listCard" hidden>
<h2>Listings</h2>
<table>
<thead><tr><th>ID</th><th>Title</th></tr></thead>
<tbody id="rows"></tbody>
</table>
</div>

<script>
const $ = id => document.getElementById(id);

async function api(url, options = {}) {
  const response = await fetch(url, {
    credentials: "same-origin",
    ...options
  });

  const text = await response.text();
  let data;
  try { data = JSON.parse(text); }
  catch { throw new Error(text || `HTTP ${response.status}`); }

  if (!response.ok) {
    throw new Error(data.error || JSON.stringify(data));
  }
  return data;
}

function status(message, error = false) {
  $("status").textContent = message;
  $("status").className = error ? "error" : "success";
}

async function loadShops() {
  const data = await api("/api/shops");
  const shops = data.results || [];

  if (!shops.length) {
    throw new Error("Etsy connected, but no shop was returned.");
  }

  $("shops").innerHTML = shops.map(shop =>
    `<option value="${shop.shop_id}">${escapeHtml(shop.shop_name || shop.shop_id)}</option>`
  ).join("");

  $("shopCard").hidden = false;
  status(`✅ Connected. Found ${shops.length} shop(s).`);
}

async function checkConnection() {
  try {
    const me = await api("/api/me");
    if (!me.connected) {
      status("Not connected.");
      return;
    }
    await loadShops();
  } catch (error) {
    status(error.message, true);
  }
}

$("connect").onclick = async () => {
  try {
    status("Opening Etsy authorization…");
    const data = await api("/api/auth/start");
    window.location.href = data.authorizeUrl;
  } catch (error) {
    status(error.message, true);
  }
};

$("logout").onclick = async () => {
  try {
    await api("/api/auth/logout", { method: "POST" });
    window.location.reload();
  } catch (error) {
    status(error.message, true);
  }
};

$("loadListings").onclick = async () => {
  try {
    const shopId = $("shops").value;
    const data = await api(
      "/api/listings?shop_id=" + encodeURIComponent(shopId)
    );

    $("rows").innerHTML = (data.results || []).map(listing =>
      `<tr><td>${listing.listing_id}</td><td>${escapeHtml(listing.title || "")}</td></tr>`
    ).join("");

    $("listCard").hidden = false;
  } catch (error) {
    status(error.message, true);
  }
};

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[char]));
}

checkConnection();
</script>
</body>
</html>
