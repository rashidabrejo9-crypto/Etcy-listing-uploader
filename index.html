<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Etsy Listing Uploader</title>
<style>
body{font-family:Arial,sans-serif;max-width:900px;margin:30px auto;padding:0 16px;background:#fafafa;color:#222}
.card{background:white;border:1px solid #ddd;border-radius:12px;padding:20px;margin:16px 0}
button{padding:10px 16px;border:0;border-radius:8px;cursor:pointer}
input,textarea,select{width:100%;box-sizing:border-box;margin:6px 0 14px;padding:10px;border:1px solid #ccc;border-radius:7px}
#status{white-space:pre-wrap}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}
</style>
</head>
<body>
<h1>🛍️ Etsy Listing Uploader</h1>
<div class="card">
  <h2>Connect Etsy Shop</h2>
  <button id="connect">Connect Etsy</button>
  <div id="status">Checking connection…</div>
</div>

<div class="card" id="shopCard" hidden>
  <h2>Shop</h2>
  <select id="shops"></select>
  <button id="load">Load Listings</button>
</div>

<div class="card" id="listCard" hidden>
  <h2>Listings</h2>
  <table><thead><tr><th>ID</th><th>Title</th><th>Price</th></tr></thead><tbody id="rows"></tbody></table>
</div>

<script>
const $=id=>document.getElementById(id);
async function api(url,opts={}) {
  const r=await fetch(url,opts);
  const text=await r.text();
  let data; try{data=JSON.parse(text)}catch{throw new Error("API returned non-JSON: "+text.slice(0,120))}
  if(!r.ok) throw new Error(data.error||JSON.stringify(data));
  return data;
}
async function check(){
  try{
    const me=await api("/api/me");
    if(me.connected){$("status").textContent="✅ Etsy connected"; await shops();}
    else $("status").textContent="Not connected";
  }catch(e){$("status").textContent=e.message}
}
$("connect").onclick=async()=>{
  try{const x=await api("/api/auth/start"); location.href=x.authorizeUrl}
  catch(e){$("status").textContent=e.message}
};
async function shops(){
  const x=await api("/api/shops");
  $("shops").innerHTML=(x.results||[]).map(s=>`<option value="${s.shop_id}">${s.shop_name}</option>`).join("");
  $("shopCard").hidden=false;
}
$("load").onclick=async()=>{
  try{
    const id=$("shops").value;
    const x=await api("/api/listings?shop_id="+encodeURIComponent(id));
    $("rows").innerHTML=(x.results||[]).map(l=>`<tr><td>${l.listing_id}</td><td>${escapeHtml(l.title||"")}</td><td>${l.price?.amount??""} ${l.price?.divisor?"":" "}</td></tr>`).join("");
    $("listCard").hidden=false;
  }catch(e){$("status").textContent=e.message}
};
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
check();
</script>
</body>
</html>
